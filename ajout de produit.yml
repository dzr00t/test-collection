info:
  name: ajout de produit
  type: http
  seq: 3

http:
  method: POST
  url: "{{URL1}}public/products"
  body:
    type: json
    data: |-
      {
        "name": "{{$randomProduct}}",
        "description": "{{$randomDatabaseEngine}}",
        "price": {{prix}},
        "stock": {{stock}},
        "image_url": "https://..."
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let stock=(Math.random()*41)+20
        let prix=(Math.random()*87.50)+20.50
        bru.setCollectionVar("prix",prix.toFixed(2))
        bru.setCollectionVar("stock",stock.toFixed(0))
    - type: after-response
      code: |-
        test("Verifier code statue  201 ou 403",()=>{
        expect([201, 403]).to.include(res.getStatus());
        })

        test("Verfier ce que on a envoyer est bien ce que on recus ", function() {
          const body = req.getBody();
          const resBody = res.getBody();

          switch (res.getStatus()) {
            case 201:
              expect(body.name).equals(resBody.product.name);
              expect(body.description).equals(resBody.product.description);
              expect(body.price).equals(resBody.product.price);
              expect(body.stock).equals(resBody.product.stock);
              break;

            case 403:
              expect("Accès réservé aux administrateurs.").equals(resBody.message);
              break;

            default:
              throw new Error(`Statut inattendu : ${res.getStatus()}`);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
